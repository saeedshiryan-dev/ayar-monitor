name: Inspect User Supplied Codal File

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/codal-direct-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download report directly from Codal and extract contents
        env:
          CODAL_DIRECT_URL: "https://www.codal.ir/Reports/DownloadFile.aspx?id=05QQQaQQQisuOOObOOOKInhOjqqMY5Uduw%3d%3d"
        run: |
          python -m pip install --quiet requests openpyxl pymupdf
          python - <<'PY'
          import os, json, re, hashlib
          from io import BytesIO
          from html.parser import HTMLParser
          import requests
          url = os.environ["CODAL_DIRECT_URL"]
          headers = {"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36","Referer":"https://www.codal.ir/"}
          r = requests.get(url, headers=headers, timeout=(20,90), allow_redirects=True)
          r.raise_for_status()
          data = r.content
          if len(data) < 100: raise RuntimeError("Downloaded response is too small")
          result = {"source":"Codal direct DownloadFile link supplied by user","final_url":r.url,"http_status":r.status_code,"content_type":r.headers.get("Content-Type"),"content_disposition":r.headers.get("Content-Disposition"),"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"format":None,"text":""}
          if data.startswith(b"%PDF"):
              import fitz
              doc=fitz.open(stream=data,filetype="pdf")
              result["format"]="PDF"
              result["page_count"]=len(doc)
              result["text"]="\n\n".join(p.get_text("text") for p in doc)
          elif data.startswith(b"PK"):
              from openpyxl import load_workbook
              wb=load_workbook(BytesIO(data),read_only=True,data_only=True)
              result["format"]="XLSX"
              result["sheets"]=[]
              chunks=[]
              for ws in wb.worksheets:
                  rows=[]
                  for row in ws.iter_rows(values_only=True):
                      vals=[str(v) if v is not None else "" for v in row]
                      if any(vals): rows.append(vals)
                  result["sheets"].append({"name":ws.title,"rows":len(rows)})
                  chunks.append("\n".join(" | ".join(x) for x in rows))
              result["text"]="\n\n".join(chunks)
              wb.close()
          else:
              class T(HTMLParser):
                  def __init__(self): super().__init__(); self.parts=[]
                  def handle_data(self,d):
                      if d and d.strip(): self.parts.append(d.strip())
              p=T()
              try:
                  p.feed(data.decode("utf-8",errors="replace"))
                  result["format"]="HTML_OR_TEXT"
                  result["text"]="\n".join(p.parts)
              except Exception:
                  result["format"]="UNKNOWN"
                  result["text"]=data[:2000].decode("utf-8",errors="replace")
          os.makedirs("codal-inspection",exist_ok=True)
          with open("codal-inspection/report_extract.json","w",encoding="utf-8") as f: json.dump(result,f,ensure_ascii=False,indent=2)
          with open("codal-inspection/report_extract.txt","w",encoding="utf-8") as f: f.write(result["text"])
          print(json.dumps({k:v for k,v in result.items() if k!="text"},ensure_ascii=False,indent=2))
          print("EXTRACTED_TEXT_BEGIN")
          print(result["text"][:18000])
          print("EXTRACTED_TEXT_END")
          PY
      - name: Upload extracted Codal report
        uses: actions/upload-artifact@v4
        with:
          name: ayar-codal-report-extract
          path: codal-inspection/
          retention-days: 7
