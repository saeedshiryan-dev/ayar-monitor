name: Probe Ayar Loader intraday fallback

on:
  push:
    paths:
      - 'scripts/probe_ayar_loader_intraday.py'
      - '.github/workflows/probe-ayar-loader.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cancel superseded full-history runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 44709052520 44709286303 44709689346 44709777818; do
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/saeedshiryan-dev/ayar-monitor/actions/runs/$run_id/cancel" || true
          done
      - run: python -m pip install requests
      - run: python scripts/probe_ayar_loader_intraday.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ayar-loader-intraday-probe
          path: build/loader_probe.json
          retention-days: 7
