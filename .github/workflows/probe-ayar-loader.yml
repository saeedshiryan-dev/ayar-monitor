name: Probe Ayar Loader intraday fallback

on:
  push:
    paths:
      - 'scripts/probe_ayar_loader_intraday.py'
      - '.github/workflows/probe-ayar-loader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python scripts/probe_ayar_loader_intraday.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ayar-loader-intraday-probe
          path: build/loader_probe.json
          retention-days: 7
