name: Probe Ayar Loader intraday fallback

on:
  push:
    paths:
      - 'scripts/probe_ayar_loader_intraday.py'
      - 'scripts/probe_ayar_closing_history.py'
      - 'scripts/probe_ayar_gap_closing_history.py'
      - '.github/workflows/probe-ayar-loader.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cancel superseded full-history runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 44709052520 44709286303 44709689346 44709777818 44711898337 44712146291; do
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/saeedshiryan-dev/ayar-monitor/actions/runs/$run_id/cancel" || true
          done
      - run: python -m pip install requests
      - run: python scripts/probe_ayar_closing_history.py
      - name: Probe all 39 missing intraday dates using cumulative closing snapshots
        run: python scripts/probe_ayar_gap_closing_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ayar-loader-intraday-probe
          path: build/
          retention-days: 7
      - name: Commit gap probe report for review
        if: always()
        run: |
          if [ -f build/gap_closing_history_probe.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add build/gap_closing_history_probe.json
            if ! git diff --cached --quiet; then
              git commit -m 'Add Ayar gap closing-history probe results'
              git push
            fi
          fi
