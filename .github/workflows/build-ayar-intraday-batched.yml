name: Build Ayar Intraday Candles (Batched)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Trading days per checkpoint batch"
        required: false
        default: "10"
        type: string
      workers:
        description: "Concurrent requests (1-3)"
        required: false
        default: "2"
        type: string

concurrency:
  group: ayar-intraday-batched
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Download TSETMC trades in small batches with checkpoints
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
          WORKERS: ${{ inputs.workers }}
        run: |
          python scripts/build_ayar_intraday_batched.py --batch-size "${BATCH_SIZE:-10}" --workers "${WORKERS:-2}"

      - name: Upload latest checkpoint and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayar-intraday-batched-checkpoint
          path: build/intraday_batched/
          if-no-files-found: warn
          retention-days: 30
