name: Refresh Ayar Macro Prices

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_ayar_macro.py'
      - '.github/workflows/ayar-macro.yml'
  schedule:
    # NerkhAra publishes refreshed rates every ten minutes.
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: ayar-macro-snapshot-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Fetch free-market USD and XAU/USD prices (no API key)
        run: python scripts/fetch_ayar_macro.py

      - name: Save macro snapshot (retry safely if main advances)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          snapshot="$(mktemp)"
          cp data/ayar_macro_live.json "$snapshot"
          trap 'rm -f "$snapshot"' EXIT
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" data/ayar_macro_live.json
            git add data/ayar_macro_live.json
            if git diff --cached --quiet; then
              echo "Macro snapshot already current."
              exit 0
            fi
            git commit -m "Refresh Ayar macro market prices"
            if git push origin HEAD:main; then
              echo "Macro snapshot pushed."
              exit 0
            fi
            echo "Concurrent update detected; retrying."
            sleep 2
          done
          echo "Could not publish macro snapshot after 5 attempts."
          exit 1
