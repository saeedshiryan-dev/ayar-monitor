name: TSETMC Live History Fallback Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tsetmc-live-history-fallback.yml"
      - "scripts/update_ayar_intraday_live.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe documented TSETMC trade alternatives
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json, time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests

          code = "34144395039913458"
          date = datetime.now(ZoneInfo("Asia/Tehran")).strftime("%Y%m%d")
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8",
              "Referer": "https://www.tsetmc.com/",
              "Origin": "https://www.tsetmc.com",
          })

          probes = [
              ("history_false", f"https://cdn.tsetmc.com/api/Trade/GetTradeHistory/{code}/{date}/false", "json"),
              ("history_true", f"https://cdn.tsetmc.com/api/Trade/GetTradeHistory/{code}/{date}/true", "json"),
              ("intraday_aggregate", f"https://cdn.tsetmc.com/api/Trade/GetTradeIntraDay/{code}", "json"),
              ("legacy_trade_detail", f"http://old.tsetmc.com/tsev2/data/TradeDetail.aspx?i={code}", "text"),
          ]

          for name, url, kind in probes:
              result = {"probe": name, "url": url, "date": date}
              started = time.monotonic()
              try:
                  response = session.get(url, timeout=(15, 60))
                  result.update({
                      "http_status": response.status_code,
                      "elapsed_seconds": round(time.monotonic()-started, 2),
                      "content_type": response.headers.get("Content-Type"),
                      "body_length": len(response.content),
                  })
                  response.raise_for_status()
                  if kind == "json":
                      payload = response.json()
                      result["json_valid"] = True
                      result["top_level_keys"] = list(payload.keys()) if isinstance(payload, dict) else None
                      key = next(iter(payload.keys()), None) if isinstance(payload, dict) else None
                      rows = payload.get(key) if key else None
                      result["payload_key"] = key
                      result["rows_type"] = type(rows).__name__
                      result["rows_count"] = len(rows) if isinstance(rows, list) else None
                      result["sample_first"] = rows[0] if isinstance(rows, list) and rows else rows
                      result["sample_last"] = rows[-1] if isinstance(rows, list) and rows else None
                      if isinstance(rows, list) and rows:
                          result["row_fields"] = sorted(rows[0].keys()) if isinstance(rows[0], dict) else None
                      result["usable"] = isinstance(rows, list) and len(rows) > 0
                  else:
                      body = response.text
                      result["body_prefix"] = body[:1200]
                      result["usable"] = bool(body.strip()) and len(body) > 20
              except Exception as exc:
                  result["error"] = f"{type(exc).__name__}: {str(exc)[:350]}"
                  result["usable"] = False
              print(json.dumps(result, ensure_ascii=False), flush=True)
          PY
