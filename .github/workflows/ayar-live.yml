name: Refresh Ayar Live Quote

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows use UTC; run every 5 minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Fetch official TSETMC quote
        run: python scripts/fetch_ayar_live.py

      - name: Save snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ayar_live.json
          git diff --cached --quiet || git commit -m "Refresh official Ayar live quote"
          git push
