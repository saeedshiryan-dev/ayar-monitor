name: Refresh Ayar Live Quote

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ayar_market_status.py'
      - 'scripts/fetch_ayar_live.py'
      - 'scripts/update_ayar_intraday_live.py'
      - 'scripts/find_ayar_tsetmc_proxy.py'
      - 'calculate_ayar_intraday_indicators.py'
      - '.github/workflows/ayar-live.yml'
  schedule:
    # GitHub scheduled workflows use UTC; run every 5 minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: write

# Prevent overlapping scheduled/manual runs from racing to update the snapshot.
concurrency:
  group: ayar-live-snapshot-main
  # Live snapshots are replaceable: the newest run must supersede queued/stale runs.
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Find a working Iranian route for TSETMC trade endpoints
        run: python scripts/find_ayar_tsetmc_proxy.py

      - name: Fetch official TSETMC quote (retry transient TSETMC failures)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "TSETMC fetch attempt $attempt/3"
            if python scripts/fetch_ayar_live.py; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "TSETMC remained unavailable after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Validate that the snapshot was freshly written
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("data/ayar_live.json")
          if not p.exists():
              raise SystemExit("data/ayar_live.json was not created")
          data = json.loads(p.read_text(encoding="utf-8"))
          stamp = datetime.fromisoformat(data["retrieved_at"])
          age = (datetime.now(stamp.tzinfo) - stamp).total_seconds()
          if age < -60 or age > 180:
              raise SystemExit(f"Snapshot is stale or timestamp invalid: age={age:.0f}s")
          if data.get("symbol") != "عیار" or data.get("insCode") != "34144395039913458":
              raise SystemExit("Snapshot symbol/insCode validation failed")
          print(f"Fresh Ayar snapshot validated; age={age:.0f}s")
          print(f"Quote date={data.get('tsetmc_quote_date')}, trades={data.get('tsetmc_quote_trade_count')}")
          print(f"Live price={data.get('live_price')}, NAV status={data.get('nav', {}).get('status')}")
          PY

      - name: Build provisional intraday candles from today's TSETMC trades
        run: python scripts/update_ayar_intraday_live.py

      - name: Recalculate 1h and 4h indicators with the latest provisional candles
        run: python calculate_ayar_intraday_indicators.py

      - name: Save snapshot (retry safely if main advances)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          snapshot_dir="$(mktemp -d)"
          cp data/ayar_live.json "$snapshot_dir/ayar_live.json"
          cp data/ayar_intraday_live.json "$snapshot_dir/ayar_intraday_live.json"
          cp data/ayar_intraday_indicators.json "$snapshot_dir/ayar_intraday_indicators.json"
          trap 'rm -rf "$snapshot_dir"' EXIT

          for attempt in 1 2 3 4 5; do
            echo "Save attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot_dir/ayar_live.json" data/ayar_live.json
            cp "$snapshot_dir/ayar_intraday_live.json" data/ayar_intraday_live.json
            cp "$snapshot_dir/ayar_intraday_indicators.json" data/ayar_intraday_indicators.json
            git add data/ayar_live.json data/ayar_intraday_live.json data/ayar_intraday_indicators.json

            if git diff --cached --quiet; then
              echo "Snapshot is already up to date."
              exit 0
            fi

            git commit -m "Refresh official Ayar live quote"

            if git push origin HEAD:main; then
              echo "Snapshot pushed successfully."
              exit 0
            fi

            echo "Push raced with another update; retrying from latest main."
            sleep 2
          done

          echo "Could not push snapshot after 5 attempts."
          exit 1
