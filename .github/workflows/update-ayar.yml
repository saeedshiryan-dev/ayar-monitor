name: Update Ayar Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_ayar_intraday_history.py'
      - 'scripts/ayar_validation.py'\n      - 'scripts/ayar_indicator_lab.py'\n      - 'indicator-lab.html'
      - 'tests/test_ayar_validation.py'
      - 'validation.html'
      - 'calculate_ayar_intraday_indicators.py'
      - '.github/workflows/update-ayar.yml'
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

# Serialize historical rebuilds with the five-minute live snapshot writer.
concurrency:
  group: ayar-history-rebuild-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Fetch daily Ayar data
        run: python scripts/update_ayar.py

      - name: Fetch Ayar historical data
        run: python scripts/update_ayar_history.py

      - name: Fetch and validate rolling intraday history
        run: python scripts/update_ayar_intraday_history.py

      - name: Calculate daily indicators
        run: python calculate_ayar_indicators.py

      - name: Calculate 1h and 4h indicators
        run: python calculate_ayar_intraday_indicators.py

      - name: Run statistical validation and update signal ledger
        run: |
          python -m unittest discover -s tests -p 'test_ayar_validation.py'
          python scripts/ayar_validation.py\n          python scripts/ayar_indicator_lab.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update Ayar market data"

          # The live quote workflow can update data/ while this historical
          # workflow is running. Rebase our generated data commit on the
          # latest main and retry the push instead of failing on a race.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort
              echo "Rebase failed on attempt $attempt"
              sleep $((attempt * 3))
              continue
            fi

            if git diff --cached --quiet && git diff --quiet; then
              echo "No data changes remain after syncing with origin/main"
              exit 0
            fi

            if git push origin HEAD:main; then
              echo "Ayar data pushed successfully on attempt $attempt"
              exit 0
            fi

            echo "Push race on attempt $attempt; retrying"
            sleep $((attempt * 3))
          done

          echo "Unable to push Ayar data after 5 attempts"
          exit 1
