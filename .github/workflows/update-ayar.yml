
name: Update Ayar Data

on:
  workflow_dispatch:
  schedule:
    # Every day at 18:30 Tehran time (15:00 UTC)
    - cron: "0 15 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Fetch and process Ayar data
        run: python scripts/update_ayar.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update Ayar market data"
          git push
