name: Deploy Ayar Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh Ayar Live Quote", "Refresh Ayar Fund NAV History"]
    types: [completed]
  push:
    paths:
      - 'index.html'
      - 'indicator-lab.html'
      - 'validation.html'
      - 'data/ayar_indicator_lab.json'
      - 'data/ayar_intraday_indicators.json'
      - 'data/ayar_live.json'
      - 'data/ayar_fund_history.json'
      - 'data/ayar_codal_portfolio.json'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare dashboard site
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp indicator-lab.html public/indicator-lab.html
          cp validation.html public/validation.html
          mkdir -p public/data
          cp data/ayar_indicator_lab.json public/data/ayar_indicator_lab.json

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
