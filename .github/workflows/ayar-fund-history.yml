name: Refresh Ayar Fund NAV History

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_ayar_fund_history.py'
      - 'scripts/fetch_ayar_codal_portfolio.py'
      - '.github/workflows/ayar-fund-history.yml'
  schedule:
    # Daily after the Iran commodity-fund trading session.
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: ayar-fund-history-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests openpyxl

      - name: Test direct Codal download link supplied by user
        id: codal_direct
        continue-on-error: true
        env:
          CODAL_DIRECT_URL: "https://www.codal.ir/Reports/DownloadFile.aspx?id=05QQQaQQQisuOOObOOOKInhOjqqMY5Uduw%3d%3d"
        run: |
          python - <<'PY'
          import os, requests, hashlib
          url = os.environ["CODAL_DIRECT_URL"]
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36", "Referer": "https://www.codal.ir/"}
          try:
              r = requests.get(url, headers=headers, timeout=(20, 90), allow_redirects=True)
              print("HTTP_STATUS:", r.status_code)
              print("FINAL_URL:", r.url)
              print("CONTENT_TYPE:", r.headers.get("Content-Type"))
              print("CONTENT_DISPOSITION:", r.headers.get("Content-Disposition"))
              print("BYTES:", len(r.content))
              print("MAGIC:", repr(r.content[:24]))
              print("SHA256:", hashlib.sha256(r.content).hexdigest())
              r.raise_for_status()
              if len(r.content) < 100:
                  raise RuntimeError("Response is too small to be a valid report")
              os.makedirs("codal_direct", exist_ok=True)
              ext = ".pdf" if r.content.startswith(b"%PDF") else ".xlsx" if r.content.startswith(b"PK") else ".bin"
              open("codal_direct/user_supplied_report" + ext, "wb").write(r.content)
              print("DOWNLOAD_RESULT: SUCCESS")
          except Exception as e:
              print("DOWNLOAD_RESULT: FAILED")
              print("ERROR:", type(e).__name__, str(e))
              raise
          PY

      - name: Upload direct Codal file if download succeeded
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codal-direct-download
          path: codal_direct/
          if-no-files-found: ignore
          retention-days: 2

      - name: Fetch official Ayar fund NAV history and aggregate NAV data
        run: python scripts/fetch_ayar_fund_history.py

      - name: Fetch latest official Ayar monthly portfolio report from Codal
        run: python scripts/fetch_ayar_codal_portfolio.py

      - name: Save validated fund and Codal portfolio snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp)"
          cp data/ayar_fund_history.json "$snapshot"
          portfolio_snapshot="$(mktemp)"
          cp data/ayar_codal_portfolio.json "$portfolio_snapshot"
          trap 'rm -f "$snapshot" "$portfolio_snapshot"' EXIT
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" data/ayar_fund_history.json
            cp "$portfolio_snapshot" data/ayar_codal_portfolio.json
            git add data/ayar_fund_history.json data/ayar_codal_portfolio.json
            if git diff --cached --quiet; then
              echo "Fund history snapshot already current."
              exit 0
            fi
            git commit -m "Refresh Ayar fund NAV history"
            if git push origin HEAD:main; then
              echo "Fund history saved."
              exit 0
            fi
            echo "Push race; retrying."
            sleep 2
          done
          echo "Could not save fund history after five attempts."
          exit 1
