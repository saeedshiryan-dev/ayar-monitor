name: Update Ayar Intraday Candles (Incremental)

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Concurrent requests (1 or 2)"
        required: false
        default: "2"
        type: string
  schedule:
    # 19:00 Tehran time; after the regular market session and closing auction.
    - cron: "30 15 * * *"
  push:
    paths:
      - "scripts/build_ayar_intraday_incremental.py"
      - "scripts/update_ayar_history.py"
      - "scripts/validate_ayar_candles.py"
      - "calculate_ayar_intraday_indicators.py"
      - ".github/workflows/build-ayar-intraday-incremental.yml"

permissions:
  contents: write

concurrency:
  group: ayar-intraday-incremental
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Refresh official daily trading calendar and reconciliation data
        run: python scripts/update_ayar_history.py

      - name: Fetch only missing and new trading days
        run: python scripts/build_ayar_intraday_incremental.py --workers "${{ inputs.workers || '2' }}"

      - name: Independently validate OHLC, daily reconciliation and H1-H4 aggregation
        run: python scripts/validate_ayar_candles.py

      - name: Recalculate 1h and 4h indicators from validated historical candles
        run: python calculate_ayar_intraday_indicators.py

      - name: Publish validated candles and indicators to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday/ayar_1h.csv data/intraday/ayar_4h.csv data/intraday/validation_report.json data/intraday/quarantined_4h.csv data/ayar_daily_history.json data/ayar_intraday_indicators.json
          if git diff --cached --quiet; then
            echo "No validated candle updates to publish."
            exit 0
          fi
          git commit -m "Update validated Ayar 1h and 4h candles"

          # Other workflows may publish to main while this job is building.
          # Rebase our validated data commit onto the latest main and retry
          # normal (non-force) pushes to avoid non-fast-forward failures.
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict while integrating the latest main. No force push was attempted."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Validated Ayar datasets published successfully."
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              echo "main advanced during push; retrying after a fresh fetch."
              sleep 3
            fi
          done
          echo "::error::Could not publish after 5 attempts because main kept advancing."
          exit 1

      - name: Upload merged datasets and per-day audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayar-intraday-incremental
          path: build/intraday_incremental/
          if-no-files-found: warn
          retention-days: 30
