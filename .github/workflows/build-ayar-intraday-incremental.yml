name: Update Ayar Intraday Candles (Incremental)

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Concurrent requests (1 or 2)"
        required: false
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: ayar-intraday-incremental
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Fetch only missing and new trading days
        run: python scripts/build_ayar_intraday_incremental.py --workers "${{ inputs.workers || '2' }}"

      - name: Upload merged datasets and per-day audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayar-intraday-incremental
          path: build/intraday_incremental/
          if-no-files-found: warn
          retention-days: 30
