name: Repair Ayar intraday gaps

on:
  push:
    paths:
      - 'scripts/repair_ayar_intraday_gaps.py'
      - '.github/workflows/repair-ayar-intraday.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download previously validated seed candles
        uses: actions/download-artifact@v4
        with:
          name: ayar-intraday-candles-and-audit
          path: build/seed
          github-token: ${{ github.token }}
          repository: saeedshiryan-dev/ayar-monitor
          run-id: 44623122817
      - run: python -m pip install requests
      - name: Repair missing trading dates and validate both timeframes
        run: python scripts/repair_ayar_intraday_gaps.py
      - name: Publish verified candle datasets
        if: always()
        run: |
          if [ -d data/intraday ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/intraday
            if ! git diff --cached --quiet; then
              git commit -m "Publish verified Ayar intraday candles"
              git push
            fi
          fi
      - name: Upload repaired candles and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayar-intraday-repaired-and-audit
          path: build/intraday/
          if-no-files-found: warn
          retention-days: 30
