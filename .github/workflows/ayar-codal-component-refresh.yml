name: Refresh Ayar Codal and Component Quotes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ayar-codal-component-refresh.yml'
      - 'scripts/fetch_ayar_codal_portfolio.py'
      - 'scripts/fetch_ayar_component_quotes.py'
      - 'scripts/calculate_ayar_fair_nav.py'
      - 'scripts/component_valuation.py'
      - 'tests/test_component_quotes.py'
      - 'tests/test_component_valuation.py'
  schedule:
    # 18:15 Tehran time, after the 18:00 commodity-certificate session.
    # Saturday through Wednesday (Iran trading week).
    - cron: "45 14 * * 0-3,6"

permissions:
  contents: write

concurrency:
  group: ayar-codal-component-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: python -m pip install --upgrade requests openpyxl jdatetime 'fima==0.17.0'

      # Includes public IME Aske2 parsing, exact-session anchor fallback, and stale-data guards.
      - name: Validate fundamental data parsers and valuation guards
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Retry official Codal search and workbook download
        env:
          CODAL_HTTP_PROXY: ${{ secrets.CODAL_HTTP_PROXY }}
        run: python scripts/fetch_ayar_codal_portfolio.py

      - name: Fetch dated component market quotes (public IME, no token)
        run: python scripts/fetch_ayar_component_quotes.py

      - name: Recalculate component valuation with stale-quote gate
        run: python scripts/calculate_ayar_fair_nav.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ayar_codal_portfolio.json data/ayar_component_market_quotes.json data/ayar_fair_nav.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Ayar Codal and component market data"
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main
